# ===============================
# Application
# ===============================
spring.application.name=backend

# ===============================
# Database (PostgreSQL - Neon PROD)
# ===============================
spring.datasource.url=jdbc:postgresql://ep-weathered-wave-ad37xebk-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_8txqofviPX3H
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Hibernate Performance Optimizations
# ===============================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ===============================
# HikariCP Connection Pool (Neon friendly)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# Flyway (Database Migrations)
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# Multipart file upload
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Server
# ===============================
server.port=8099

# ===============================
# Logging (Production safe)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO

# ===============================
# OpenAI Configuration
# ===============================
openai.model=o4-mini
openai.temperature=0.3
openai.max-tokens=200

# ===============================
# Google Custom Search
# ===============================
google.search.max.results=10

# ===============================
# Job Research Configuration
# ===============================
job.research.allowed.file.types=application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document
job.research.max.file.size=10MB
job.research.default.location=Antananarivo

